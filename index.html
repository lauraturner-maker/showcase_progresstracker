<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearson SLA Tracker Component</title>
    <style>
        /* Pearson Brand Variables */
        :root {
            --p-navy: #0d004c;
            --p-purple: #512eab;
            --p-yellow: #ffce04;
            --p-teal: #22c7c6;
            --p-grey-light: #f4f5f7;
            --p-grey-text: #505050;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Card Container */
        .sla-card {
            background: white;
            width: 380px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Header Section */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .icon-box {
            background-color: rgba(81, 46, 171, 0.1); /* Light Purple */
            color: var(--p-purple);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .status-badge {
            background-color: rgba(34, 199, 198, 0.15); /* Light Teal */
            color: #008a89; /* Darker Teal for text readability */
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Typography */
        h3 {
            margin: 0 0 4px 0;
            color: var(--p-navy);
            font-size: 16px;
            font-weight: 700;
        }

        .metric-large {
            font-size: 32px;
            font-weight: 800;
            color: var(--p-navy);
            margin: 0;
            line-height: 1.2;
        }

        .metric-label {
            font-size: 13px;
            color: var(--p-grey-text);
            margin-bottom: 20px;
            display: block;
        }

        /* Progress Bar Container */
        .progress-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .progress-track {
            background-color: var(--p-grey-light);
            height: 12px;
            border-radius: 6px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        /* The Animated Bar */
        .progress-fill {
            background-color: var(--p-teal);
            height: 100%;
            width: 0%; /* Animate to width */
            border-radius: 6px;
            animation: fillBar 1.5s ease-out forwards;
            position: relative;
        }

        /* The "Target" Line (SLA Limit) */
        .sla-limit-marker {
            position: absolute;
            top: -4px;
            bottom: -4px;
            width: 2px;
            background-color: var(--p-navy);
            left: 80%; /* Assuming 5 days is 100%, 4 days is 80%? Adjust based on scale */
            z-index: 2;
        }

        .sla-limit-label {
            position: absolute;
            top: -20px;
            left: 80%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 600;
            color: var(--p-navy);
            white-space: nowrap;
        }

        /* Footer / Context */
        .card-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--p-grey-text);
        }

        .trend-icon {
            color: var(--p-teal);
            font-weight: bold;
        }

        /* Animation */
        @keyframes fillBar {
            from { width: 0%; }
            to { width: 60%; } /* Represents 3 out of 5 days */
        }
    </style>
</head>
<body>

    <div class="sla-card">
        <div class="card-header">
            <div class="icon-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 13l-7.5 7.5c-.8.8-2.1.8-2.9 0-.8-.8-.8-2.1 0-2.9L11 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></svg>
            </div>
            <span class="status-badge">On Track</span>
        </div>

        <div>
            <h3>Legal Review SLA Tracker</h3>
            <div class="metric-large">3 Days</div>
            <span class="metric-label">Average turnaround time</span>
        </div>

        <div class="progress-wrapper">
            <div class="sla-limit-label">SLA Goal: 5 Days</div>
            <div class="sla-limit-marker" style="left: 100%;"></div> 
            <div class="progress-track">
                <div class="progress-fill" style="width: 60%;"></div>
            </div>
        </div>

        <div class="card-footer">
            <span class="trend-icon">▼ 12%</span> 
            <span>faster than last month</span>
        </div>
    </div>
    </body>
</html>
