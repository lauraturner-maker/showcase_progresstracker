<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pearson SLA Tracker - Fixed Layout</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: transparent;">

    <div style="background: white; width: 100%; max-width: 300px; padding: 20px; border-radius: 12px; border: 1px solid #e0e0e0; box-sizing: border-box; overflow: visible;">
        
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
            <div style="background-color: #efeafb; color: #512eab; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 13l-7.5 7.5c-.8.8-2.1.8-2.9 0-.8-.8-.8-2.1 0-2.9L11 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></svg>
            </div>
            <span style="background-color: #e3f9f9; color: #008a89; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase;">On Track</span>
        </div>

        <div style="margin-bottom: 16px;">
            <h3 style="margin: 0 0 4px 0; color: #0d004c; font-size: 13px; font-weight: 700;">Legal Review SLA Tracker</h3>
            <div style="font-size: 24px; font-weight: 800; color: #0d004c; line-height: 1.2;">3 Days</div>
            <span style="font-size: 11px; color: #505050;">Average turnaround time</span>
        </div>

        <div style="width: 100%;">
            
            <div style="display: flex; justify-content: flex-end; margin-bottom: 6px;">
                <span style="font-size: 10px; font-weight: 700; color: #0d004c; line-height: 1;">SLA Goal: 5 Days</span>
            </div>

            <div style="position: relative; height: 12px; width: 100%;">
                
                <div style="background-color: #f4f5f7; height: 8px; width: 100%; border-radius: 4px; overflow: hidden; position: relative; line-height: 0;">
                    <div style="background-color: #22c7c6; width: 60%; height: 8px; border-radius: 4px; display: block;">&nbsp;</div>
                </div>

                <div style="position: absolute; right: 0; top: -2px; width: 2px; height: 12px; background-color: #0d004c;"></div>
                
            </div>
        </div>

        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; display: flex; align-items: center; font-size: 11px; color: #505050;">
            <span style="color: #22c7c6; font-weight: bold; margin-right: 4px;">▼ 12%</span> 
            <span>faster than last month</span>
        </div>

    </div>
</body>
</html>
